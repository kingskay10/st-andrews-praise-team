<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Member Workspace | St Andrews CCAP Praise Team</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script><script src="js/config.js"></script><script src="js/shared.js" defer></script><script src="js/app.js" defer></script></head>
<body data-page="member"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div><main class="page-shell" id="main-content"><div class="dash-header"><h1>Member Workspace</h1><span class="badge">Member</span></div><div id="page-status" class="alert" role="status" hidden></div><section class="grid dashboard-grid"><article class="card"><h2>Profile</h2><div id="profile-view"></div><form id="profile-edit-form"><div class="form-grid"><div class="form-group"><label>Name</label><input name="name" required></div><div class="form-group"><label>Position</label><input name="position"></div><div class="form-group"><label>Phone</label><input name="phone" type="tel"></div><div class="form-group"><label>Location</label><input name="location"></div><div class="form-group"><label>Social Media</label><input name="social_media"></div><div class="form-group"><label>Marital Status</label><select name="marital_status"><option value="">Not specified</option><option value="single">Single</option><option value="married">Married</option></select></div></div><button class="btn btn-primary" type="submit">Save Profile</button></form><form id="profile-photo-form"><div class="form-group"><label>Profile picture (JPG, PNG, WEBP, up to 10 MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></div><button class="btn btn-secondary" type="submit">Update Photo</button></form></article><article class="card"><h2>Post Today's Verse</h2><form id="verse-form"><div class="form-group"><label for="verse-text">Bible verse</label><textarea id="verse-text" name="verse_text" required></textarea></div><button class="btn btn-primary" type="submit">Post Verse</button></form><h2>Latest Updates</h2><div id="member-updates"></div></article></section><section class="grid dashboard-grid"><article class="card"><h2>Upcoming Events</h2><div id="member-events"></div></article><article class="card"><h2>Published Reports</h2><div id="member-reports"></div></article></section><section class="card"><h2>Personal Photo Gallery</h2><form id="member-gallery-form"><div class="form-group"><label>Upload a photo (JPG, PNG, WEBP, up to 10 MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></div><button class="btn btn-primary" type="submit">Add to Gallery</button></form><div id="personal-photos" class="gallery-grid"></div></section></main><div id="site-footer"></div></body></html>
