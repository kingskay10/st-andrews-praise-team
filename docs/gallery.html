<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gallery | St Andrews CCAP Praise Team</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script><script src="js/config.js"></script><script src="js/shared.js" defer></script><script src="js/app.js" defer></script></head>
<body data-page="gallery"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div><main class="page-shell" id="main-content"><div class="dash-header"><h1>Gallery</h1><span class="badge">Shared memories</span></div><div id="page-status" class="alert" role="status" hidden></div><section class="card"><p>Photos uploaded here are public and may appear on the homepage. Do not upload private or sensitive images.</p><form id="gallery-upload-form"><div class="form-group"><label>Add a photo (JPG, PNG, WEBP, up to 10 MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp" required></div><div class="form-group"><label>Caption</label><input name="caption" maxlength="255"></div><button class="btn btn-primary" type="submit">Upload Photo</button></form></section><div id="gallery-grid" class="gallery-grid-layout"></div></main><div id="site-footer"></div></body></html>
