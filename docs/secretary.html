<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secretary Dashboard | St Andrews CCAP Praise Team</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script><script src="js/config.js"></script><script src="js/shared.js" defer></script><script src="js/app.js" defer></script></head>
<body data-page="secretary"><a class="skip-link" href="#main-content">Skip to content</a><div id="site-header"></div><main class="page-shell" id="main-content"><div class="dash-header"><h1>Secretary Dashboard</h1><span class="badge">Secretary</span></div><div id="page-status" class="alert" role="status" hidden></div><section class="grid dashboard-grid"><article class="card"><h2>Record Monthly Finance</h2><form id="finance-form"><div class="form-grid"><div class="form-group"><label>Member</label><select name="member_id" id="finance-member" required><option value="">Select member</option></select></div><div class="form-group"><label>Month</label><input type="month" name="month" required></div><div class="form-group"><label>Contributions</label><input type="number" name="contributions" min="0" step="0.01" value="0" required></div><div class="form-group"><label>Offerings</label><input type="number" name="offerings" min="0" step="0.01" value="0" required></div><div class="form-group full-width"><label>Notes</label><textarea name="notes"></textarea></div></div><button class="btn btn-primary" type="submit">Save Record</button></form></article><article class="card"><h2>Submit Financial Summary</h2><form id="report-form"><div class="form-group"><label>Title</label><input name="title" required></div><div class="form-group"><label>Summary</label><textarea name="summary" required></textarea></div><div class="form-group"><label>Full Content</label><textarea name="content" required></textarea></div><button class="btn btn-success" type="submit">Submit to Chair</button></form></article></section><section class="card"><h2>Finance Records</h2><div class="table-wrap"><table><thead><tr><th>Member</th><th>Month</th><th>Contributions</th><th>Offerings</th><th>Notes</th></tr></thead><tbody id="finance-records"></tbody></table></div></section></main><div id="site-footer"></div></body></html>
