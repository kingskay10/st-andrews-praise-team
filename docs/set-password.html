<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set Your Password | St Andrews CCAP Praise Team</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1"></script>
  <script src="js/config.js"></script>
  <script src="js/shared.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body data-page="set-password">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="site-header"></div>
  <main class="page-shell" id="main-content">
    <div id="page-status" class="alert" role="status" hidden></div>
    <section class="card auth-card">
      <h1>Set Your Password</h1>
      <p>Choose a password for the email address that received your team invitation.</p>
      <form id="set-password-form">
        <div class="form-group"><label for="new-password">New password</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" required></div>
        <div class="form-group"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
        <button class="btn btn-primary" type="submit">Set Password</button>
      </form>
    </section>
  </main>
  <div id="site-footer"></div>
</body>
</html>
